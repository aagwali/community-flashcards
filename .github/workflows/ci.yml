name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une seule publication à la fois ; on n'annule pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Vérifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le contenu est validé par la suite de tests : une carte mal formée
      # (tag hors taxonomie, section manquante, statut inconnu) échoue ici,
      # avec le chemin du fichier fautif dans le message.
      - name: Tests et validation du contenu
        run: npm test

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

  build:
    name: Construire
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # GitHub Pages sert un "project site" sous /<nom-du-repo>/.
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GITHUB_OWNER: ${{ github.repository_owner }}
          VITE_GITHUB_REPO: ${{ github.event.repository.name }}
          VITE_GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
        run: npx vite build

      # Pages ne connaît pas les routes du client : sans ça, un rechargement
      # sur /decks/solid renverrait un 404. Le 404 sert l'application, qui
      # reprend la main sur l'URL demandée.
      - name: Préparer le repli SPA
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publier
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
